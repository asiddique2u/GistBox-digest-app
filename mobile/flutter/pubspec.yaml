publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  http: ^1.6.0
  material_ui: ^1.11.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
